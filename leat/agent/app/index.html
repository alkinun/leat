<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/temml/Temml-Latin-Modern.css">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.mjs"></script>
</head>
<body>
<nav>
  <button id="new">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat
  </button>
  <div id="conversations"></div>
  <button id="remembered">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Memory
  </button>
</nav>
<main id="main" class="empty">
  <header>
    <button id="menu" class="icon" title="Chats">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>
      </svg>
    </button>
    <select id="model"></select>
    <span id="status"></span>
  </header>
  <h1 id="greeting"></h1>
  <div id="log"></div>
  <section id="memory">
    <h1>Memory</h1>
    <p>What Leat remembers about you. Every new chat knows it; delete what it should forget.</p>
    <form id="remember">
      <input id="memorable" placeholder="Something to remember" autocomplete="off">
      <button>Add</button>
    </form>
    <ul id="memories"></ul>
  </section>
  <div id="composer">
    <div>
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button id="think" title="Think before replying: slower, for harder questions">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Think
      </button>
      <button id="send">
        <svg class="arrow" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="square" viewBox="0 0 24 24"><path d="M8 8h8v8H8z"/></svg>
      </button>
    </div>
  </div>
</main>
</body>
</html>
