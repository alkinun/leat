<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leat</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --page: #faf9f5; --side: #f3f1ea; --card: #fff; --bubble: #ece9e0; --line: #e3dfd4;
    --text: #1f1e1d; --muted: #75736c; --accent: #c96442; --error: #b3261e;
    --round: 10px; --round-large: 24px; /* controls and code; bubbles and the composer */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #262624; --side: #1f1e1d; --card: #30302e; --bubble: #3a3936; --line: #3e3d39;
      --text: #ece9e1; --muted: #a3a097; --accent: #d97757; --error: #f2847b;
    }
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  body {
    margin: 0; height: 100dvh; display: flex;
    background: var(--page); color: var(--text); font: 16px/1.65 system-ui, sans-serif;
  }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  :disabled { opacity: 0.4; cursor: default; }
  svg {
    display: block; width: 18px; height: 18px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .icon { display: grid; place-items: center; padding: 8px; border-radius: var(--round); }
  .icon:hover:enabled, select:hover:enabled, .chat:hover, .chat.current {
    background: var(--bubble);
  }

  nav {
    width: 272px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 12px;
    background: var(--side); border-right: 1px solid var(--line); font-size: 14px;
  }
  body.menu nav { display: none; } /* on a narrow screen, the menu shows it instead */
  #new {
    display: flex; gap: 10px; align-items: center; padding: 8px 10px;
    border-radius: var(--round);
  }
  #new:hover { background: var(--bubble); }
  #chats { flex: 1; overflow-y: auto; margin-top: 12px; }
  .chat {
    display: flex; align-items: center; padding: 6px 4px 6px 10px;
    border-radius: var(--round); cursor: pointer;
  }
  .chat span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chat button { padding: 0 6px; color: var(--muted); font-size: 16px; }
  .chat:not(:hover) button { visibility: hidden; }
  nav details { padding: 8px 10px; color: var(--muted); }
  nav label { display: block; margin-top: 10px; }
  nav textarea, nav input {
    display: block; width: 100%; margin-top: 4px; padding: 6px 8px; resize: vertical;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--round);
  }

  main { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  select {
    field-sizing: content; max-width: 60vw; padding: 6px 8px;
    border: none; border-radius: var(--round); background: none; font-weight: 600; cursor: pointer;
  }
  #status { color: var(--muted); font-size: 14px; }
  #status.error { color: var(--error); }
  #composer, #greeting { width: 100%; max-width: 784px; margin: 0 auto; padding: 0 24px; }
  /* the log scrolls at the window's edge, its column centered by its padding */
  #log { flex: 1; overflow-y: auto; padding: 16px max(24px, calc(50% - 368px)); }
  #greeting { display: none; font: 400 30px/1.3 ui-serif, Georgia, serif; text-align: center; }
  main.empty { justify-content: center; padding-bottom: 12vh; }
  main.empty header { position: absolute; top: 0; }
  main.empty #log { display: none; }
  main.empty #greeting { display: block; margin-bottom: 28px; }

  .message { margin-bottom: 28px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool { margin-bottom: 16px; }
  .user {
    width: fit-content; max-width: 80%; margin-left: auto; padding: 10px 16px;
    border-radius: var(--round-large); background: var(--bubble);
  }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .message details { margin-bottom: 12px; }
  .message details div {
    margin-top: 8px; padding-left: 14px; border-left: 2px solid var(--line);
    color: var(--muted); font-size: 14px;
  }
  .note { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .note:empty { display: none; }
  pre, code { font: 14px/1.5 ui-monospace, monospace; background: var(--side); }
  pre {
    margin: 12px 0; padding: 12px 16px; overflow-x: auto;
    border: 1px solid var(--line); border-radius: var(--round);
  }
  code { padding: 2px 5px; border-radius: 6px; }

  #composer { padding-bottom: 20px; }
  #composer div {
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--round-large);
    box-shadow: 0 4px 20px rgb(0 0 0 / 0.06);
  }
  #input {
    flex: 1; max-height: 240px; padding: 6px 0; resize: none; overflow-y: hidden;
    border: none; outline: none; background: none;
  }
  /* as tall as a line of the input, so that it sits centered beside one */
  #send { padding: 10px; border-radius: 50%; background: var(--accent); color: #fff; }
  #send:disabled { opacity: 1; background: var(--bubble); color: var(--muted); }
  #send:not(.stop) .square, #send.stop .arrow { display: none; }
  .square { fill: currentColor; }

  @media (max-width: 720px) {
    nav {
      display: none; position: fixed; inset: 0 auto 0 0; z-index: 1;
      box-shadow: 0 0 40px rgb(0 0 0 / 0.2);
    }
    body.menu nav { display: flex; }
    #log, #composer, #greeting { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
<nav>
  <button id="new">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat
  </button>
  <div id="chats"></div>
  <details>
    <summary>Settings</summary>
    <label>System prompt <textarea id="system" rows="5"></textarea></label>
    <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1"></label>
    <label>Top K <input id="top_k" type="number" min="0" step="1"></label>
    <label>Top P <input id="top_p" type="number" min="0" max="1" step="0.05"></label>
    <label>Min P <input id="min_p" type="number" min="0" max="1" step="0.01"></label>
    <label>Presence penalty <input id="presence_penalty" type="number" min="-2" max="2" step="0.1"></label>
    <label>Tools server <input id="tools" placeholder="http://host:8081"></label>
  </details>
</nav>
<main id="main">
  <header>
    <button id="menu" class="icon" title="Chats">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>
      </svg>
    </button>
    <select id="model"></select>
    <span id="status"></span>
  </header>
  <h1 id="greeting"></h1>
  <div id="log"></div>
  <div id="composer">
    <div>
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button id="send">
        <svg class="arrow" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="square" viewBox="0 0 24 24"><path d="M8 8h8v8H8z"/></svg>
      </button>
    </div>
  </div>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const chats = JSON.parse(localStorage.getItem("leat.chats") ?? "[]"); // the latest first
let chat = chats[0]; // the one shown
let loaded = null, loading = null; // the ids of the loaded model and of one loading
const replies = new Map(); // each chat replying, to the controller that stops its reply
const ROUNDS = 8; // replies a turn takes at most, each after the tools the last one called

// sampling as Qwen3.6 recommends for general tasks
const SETTINGS = {
  system: "", temperature: "1.0", top_k: "20", top_p: "0.95", min_p: "0", presence_penalty: "1.5",
  tools: "",
};
const SAMPLING = ["temperature", "top_k", "top_p", "min_p", "presence_penalty"];
for (const [id, value] of Object.entries(SETTINGS)) {
  $(id).value = localStorage.getItem(`leat.${id}`) ?? value;
  $(id).oninput = () => localStorage.setItem(`leat.${id}`, $(id).value);
}

$("new").onclick = () => {
  if (chat?.messages.length !== 0) chats.unshift((chat = { messages: [] }));
  document.body.classList.remove("menu");
  save();
  render();
  $("input").focus();
};
$("menu").onclick = () => document.body.classList.toggle("menu");
$("model").onchange = () => load($("model").value);
$("send").onclick = () => (replies.has(chat) ? replies.get(chat).abort() : send());
$("input").oninput = controls;
$("input").onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    if (!replies.has(chat)) send();
  }
};

render();
try {
  const busy = (await models()).find((m) => m.status === "loading");
  if (busy) await load(busy.id);
} catch (error) {
  status(error.message, true);
}

// a turn: the user's message, then replies, and the tools they call, until one calls none
async function send() {
  const content = $("input").value.trim();
  if (!content || !loaded) return;
  if (!chat) chats.unshift((chat = { messages: [] }));
  const c = chat, turn = c.messages.length, controller = new AbortController();
  c.messages.push({ role: "user", content });
  chats.splice(chats.indexOf(c), 1);
  chats.unshift(c);
  $("input").value = "";
  replies.set(c, controller);
  status("");
  try {
    const server = $("tools").value.trim().replace(/\/$/, "");
    const tools = server ? await (await fetch(`${server}/tools`)).json() : undefined;
    for (let round = 0; round < ROUNDS; round++) {
      const calls = await reply(c, tools, controller.signal);
      if (!calls.length) break;
      // a message for each call, before any runs, so that each call has its answer
      const results = calls.map(({ id, function: f }) => ({
        role: "tool", tool_call_id: id, name: f.name, arguments: JSON.parse(f.arguments),
        content: "", note: "",
      }));
      c.messages.push(...results);
      for (const result of results) {
        render();
        result.content = await run(server, result, controller.signal);
      }
    }
  } catch (error) {
    const last = c.messages.at(-1);
    if (error.name === "AbortError") {
      last.note = last.note ? `${last.note} · stopped` : "stopped";
    } else { // the turn is taken back, to send again
      c.messages.splice(turn);
      if (c === chat && !$("input").value) $("input").value = content;
      status(error.message, true);
    }
  }
  replies.delete(c);
  save();
  render();
}

// streams the model's reply to the chat so far into a message of its own: the tools it calls
async function reply(c, tools, signal) {
  const system = $("system").value.trim();
  const messages = [...(system ? [{ role: "system", content: system }] : []), ...c.messages];
  const m = { role: "assistant", content: "", reasoning: "", note: loaded };
  c.messages.push(m);
  save();
  render();
  const body = {
    model: loaded, messages: messages.map(api), tools, stream: true,
    stream_options: { include_usage: true },
    ...Object.fromEntries(SAMPLING.map((id) => [id, Number($(id).value)])),
  };
  const start = performance.now();
  const response = await post("/v1/chat/completions", body, signal);
  for await (const data of events(response)) {
    if (data.error) throw new Error(data.error.message);
    const delta = data.choices[0]?.delta ?? {};
    m.content += delta.content ?? "";
    m.reasoning += delta.reasoning_content ?? "";
    if (delta.tool_calls) m.tool_calls = delta.tool_calls; // leat sends them whole, at the end
    m.note = data.model;
    if (data.usage) {
      const n = data.usage.completion_tokens, seconds = (performance.now() - start) / 1000;
      m.note += ` · ${n} tokens, ${(n / seconds).toFixed(1)} tok/s`;
    }
    if (c === chat) follow(() => $("log").lastChild.update());
  }
  return m.tool_calls ?? [];
}

// what a tool the tools server runs answers
async function run(server, { name, arguments: args }, signal) {
  return (await (await post(`${server}/call`, { name, arguments: args }, signal)).json()).content;
}

// a message as the API takes it, without what only the app shows: with its reasoning, which
// templates such as Qwen3.5's show again to the steps of an agent's turn
function api({ role, content, reasoning, tool_calls, tool_call_id, name }) {
  const reasoning_content = reasoning || undefined;
  return { role, content, reasoning_content, tool_calls, tool_call_id, name };
}

async function load(name) {
  loaded = null;
  loading = name;
  controls();
  status(`loading ${name}…`);
  try {
    await post("/v1/models/load", { model: name });
    status("");
  } catch (error) {
    status(error.message, true);
  }
  loading = null;
  await models();
}

// the models the server has, after showing them
async function models() {
  const { data } = await (await fetch("/v1/models")).json();
  loaded = data.find((m) => m.status === "loaded")?.id ?? null;
  const none = new Option(data.length ? "Choose a model" : "No models", "");
  none.disabled = true;
  $("model").replaceChildren(none, ...data.map((m) => new Option(m.id)));
  controls();
  return data;
}

async function post(path, body, signal) {
  const response = await fetch(path, { method: "POST", body: JSON.stringify(body), signal });
  if (!response.ok) throw new Error((await response.json()).error.message);
  return response;
}

// the data of each server-sent event of a response
async function* events(response) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) return;
    const events = (buffer + value).split("\n\n");
    buffer = events.pop();
    for (const event of events) if (event !== "data: [DONE]") yield JSON.parse(event.slice(6));
  }
}

function save() {
  localStorage.setItem("leat.chats", JSON.stringify(chats));
}

function render() {
  $("chats").replaceChildren(...chats.map((c) => {
    const item = element("div", c === chat ? "chat current" : "chat");
    const remove = element("button", "", "×");
    item.append(element("span", "", c.messages[0]?.content ?? "New chat"), remove);
    item.onclick = () => {
      chat = c;
      document.body.classList.remove("menu");
      render();
    };
    remove.title = "Delete";
    remove.onclick = (event) => {
      event.stopPropagation();
      replies.get(c)?.abort();
      chats.splice(chats.indexOf(c), 1);
      if (chat === c) chat = chats[0];
      save();
      render();
    };
    return item;
  }));
  $("log").replaceChildren(...(chat?.messages ?? []).map(message));
  $("log").scrollTop = $("log").scrollHeight;
  controls();
}

// shows the controls as the state has them, the input as tall as its text
function controls() {
  const replying = replies.has(chat), input = $("input");
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight}px`;
  input.style.overflowY = input.scrollHeight > 240 ? "auto" : "hidden"; // its max-height
  $("main").classList.toggle("empty", !chat?.messages.length);
  $("greeting").textContent = loaded ? "How can I help?" : loading ? "Loading…" : "Choose a model";
  $("send").classList.toggle("stop", replying);
  $("send").title = replying ? "Stop" : "Send";
  $("send").disabled = !replying && !(loaded && input.value.trim());
  $("model").value = loading ?? loaded ?? "";
  $("model").disabled = loading !== null || replies.size > 0;
}

function status(text, error = false) {
  $("status").textContent = text;
  $("status").className = error ? "error" : "";
}

// a message's element, whose update() shows it again as it grows
function message(m) {
  const item = element("div", `message ${m.role}`);
  const thinking = element("details"), reasoning = element("div");
  const text = element("div"), note = element("div", "note");
  const summary = element("summary", "", "Thinking"), tool = m.role === "tool";
  thinking.append(summary, reasoning);
  item.append(thinking, text, note);
  item.update = () => { // a tool's message shows its call, and folds its answer away
    if (tool) summary.textContent = `${m.name}: ${Object.values(m.arguments).join(", ")}`;
    if (tool && !m.content) summary.textContent += " …";
    thinking.hidden = !(tool || m.reasoning);
    item.hidden = Boolean(m.tool_calls) && !m.content && !m.reasoning; // its calls show it
    reasoning.textContent = (tool ? m.content : m.reasoning)?.trim() ?? "";
    text.replaceChildren(...format(tool ? "" : m.content));
    note.textContent = m.note ?? "";
  };
  item.update();
  return item;
}

// text with its code blocks, inline code and bold set apart: a little of Markdown
function format(text) {
  return text.split(/^ *```.*\n?/m).flatMap((part, i) => {
    if (i % 2) return [element("pre", "", part.replace(/\n$/, ""))];
    return part.trim().split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).map((piece, j) => {
      if (j % 2 === 0) return piece;
      return piece[0] === "`" ? element("code", "", piece.slice(1, -1))
        : element("strong", "", piece.slice(2, -2));
    });
  });
}

// runs a change to the log, keeping it scrolled to the end if it was
function follow(change) {
  const log = $("log"), end = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  change();
  if (end) log.scrollTop = log.scrollHeight;
}

function element(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text) e.textContent = text;
  return e;
}
</script>
</body>
</html>
