# leat agent's user, whose home is the office's data; and the front door's, Caddy's, whose state is
# the box's certificate and its account, kept with the box's identity. Of fixed IDs, as the files
# they own outlive the system's partition, which an update replaces with one whose sysusers would
# number its users anew, as packages come and go
u leat 800 "Leat" /var/lib/leat
u leat-proxy 801 "Leat's front door" /etc/leat/proxy
