<!doctype html>
<!-- What http://leat.local, or the box's address, shows: the box's name tried, of its logo, and
the browser sent there once it answers, at the path asked for; else, as a router that hides the
office's own addresses from its devices does, why not, and the name tried again every few seconds,
so that the page goes on by itself once the router lets it. Caddy fills in the name, of templates;
its words are the box's screen's, as leat/locales/de.json has them. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leat</title>
<style>
  body { margin: 0; padding: 48px 24px; font: 16px/1.5 system-ui, sans-serif; color: #111;
         background: #fff; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  p { margin: 0 0 12px; color: #555; }
  a { color: inherit; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #0b0b0b; } p { color: #aaa; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Leat</h1>
  <p id="said"></p>
  <p id="then" hidden></p>
</main>
<script>
const name = "{{env "LEAT_NAME"}}", there = `https://${name}${location.pathname}${location.search}`;
const german = navigator.language.toLowerCase().startsWith("de");
const where = "Heimnetz › Netzwerk › Netzwerkeinstellungen › DNS-Rebind-Schutz";
const words = german ? {
  opening: "Leat wird geöffnet…",
  title: "Leat ist unter seinem Namen nicht erreichbar",
  said: `Der Router verbirgt Adressen im Büro vor den Geräten hier. Tragen Sie auf einer FRITZ!Box leatbox.net unter ${where} ein.`,
  then: "Diese Seite öffnet Leat von selbst, sobald es erreichbar ist:",
} : {
  opening: "Opening Leat…",
  title: "Leat can't be found by its name",
  said: `The router hides addresses inside the office from the devices here. On a FRITZ!Box, add leatbox.net under ${where}.`,
  then: "This page opens Leat by itself once it can be reached:",
};
document.documentElement.lang = german ? "de" : "en";
document.getElementById("said").textContent = words.opening;

// whether the box answers at its name: its logo loaded, over HTTPS, of a certificate the browser
// trusts, within a few seconds
function answers() {
  return new Promise((resolve) => {
    const logo = new Image(), late = setTimeout(() => resolve(false), 5000);
    logo.onload = () => { clearTimeout(late); resolve(true); };
    logo.onerror = () => { clearTimeout(late); resolve(false); };
    logo.src = `https://${name}/logo.svg?${Date.now()}`;
  });
}

async function reach() {
  if (await answers()) return location.replace(there);
  document.getElementById("title").textContent = words.title;
  document.getElementById("said").textContent = words.said;
  const then = document.getElementById("then"), link = document.createElement("a");
  link.href = link.textContent = `https://${name}`;
  then.replaceChildren(`${words.then} `, link);
  then.hidden = false;
  setTimeout(reach, 5000);
}
reach();
</script>
</body>
</html>
