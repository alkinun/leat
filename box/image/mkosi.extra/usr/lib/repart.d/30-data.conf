# the box's state, at /var: the office's data, conversations, files and their index, at
# /var/lib/leat, and the system's, its Wi-Fi networks, certificates and journal, as the system's
# partitions are replaced by updates: the rest of the disk. Encrypted as the identity's is; deleted
# and made anew of a factory reset, of a new key, so that nothing of before can be read again
[Partition]
Type=linux-generic
Label=leat-data
Format=ext4
Encrypt=tpm2
FactoryReset=yes
SizeMinBytes=2G
