# the box's identity, of provisioning, at /etc/leat: its name, its registration and its certificate's
# account, kept on a partition of its own, as the system's partitions are replaced by updates and
# the data's by a factory reset, and the identity outlives both. Encrypted, unlocked by the TPM for
# a UKI of ours alone, of the public key in /usr/lib/systemd, as a stolen box's disk gives none away
[Partition]
Type=linux-generic
Label=leat-identity
Format=ext4
Encrypt=tpm2
SizeMinBytes=64M
SizeMaxBytes=64M
