# no restart into an update that failed, its UKI of no tries left: systemd-sysupdate counts it the
# newest installed, and would restart the box every night, systemd-boot booting the system before
# each time, until a newer update came
[Service]
ExecCondition=sh -c '! ls /boot/EFI/Linux | sort -V | tail -n 1 | grep -q "+0-"'
