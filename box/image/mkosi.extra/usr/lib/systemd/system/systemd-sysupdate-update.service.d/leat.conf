# an update cut off, as by a power cut or the internet lost while it downloaded, its partition left
# half written: removed first, as systemd-sysupdate leaves it there else and refuses every update
# after, "partially installed", so that a box never took one again. A whole update waiting for the
# night's restart is kept
[Service]
ExecStartPre=-/usr/lib/systemd/systemd-sysupdate vacuum
