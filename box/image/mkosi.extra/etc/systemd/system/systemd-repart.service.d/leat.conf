# The data partition's ext4 made without writing its journal and inode tables whole first, which the
# kernel clears as it goes: on a slow disk, a USB stick a laptop under test booted, mke2fs took 7
# minutes zeroing a 99 GB partition's journal, the disk locked meanwhile and the boot waiting on it.
# And a factory reset, an admin's, carried out of the flag the box's helper put on the ESP: the state's
# partition deleted and made anew, of a new key, before anything unlocks it, the flag then taken away
[Unit]
RequiresMountsFor=/boot

[Service]
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EXT4="-E lazy_itable_init=1,lazy_journal_init=1"
EnvironmentFile=-/boot/leat-reset
ExecStart=
ExecStart=systemd-repart --dry-run=no $LEAT_FACTORY_RESET
ExecStartPost=rm -f /boot/leat-reset
