# For development alone, never a box's: a console logged in as root, and SSH, by the keys of
# mkosi.local.conf and mkosi.local.extra/ (git-ignored), as its root/.ssh/authorized_keys
[Content]
Autologin=yes
# its boot on a serial console too, as a VM's is watched
KernelCommandLine=console=ttyS0
Packages=openssh
Ssh=always
