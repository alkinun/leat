# The box's disk image: headless Arch as it boots on the box, built by mkosi from a pinned snapshot
# of Arch's packages, so that a build of the same commit makes the same system.
#
#     cd box/image && mkosi build          # mkosi.output/leat-box.raw
#     mkosi --profile dev vm               # boots it, a console logged in as root
[Distribution]
Distribution=arch
Snapshot=2026/10/10

[Output]
Format=disk
ImageId=leat-box
# of one name whatever its version, which its os-release says, as vm.sh, flash.sh and serve.sh take it
Output=leat-box
OutputDirectory=mkosi.output
# and its UKI and system's partition alone, which publish.sh makes an update of
SplitArtifacts=uki,partitions

[Build]
ToolsTree=default
CacheDirectory=mkosi.cache
# mkosi.build.chroot's: the repository, at /work/src/leat; its downloads, kept between builds; and the
# network it builds with, of pinned versions alone
BuildSources=../..:leat
BuildDirectory=mkosi.builddir
WithNetwork=yes
Incremental=yes

[Content]
# the box's, set here, so that no first boot ever asks: Europe's offices first; its time zone is
# where workflows' schedules run; its keymap and font in mkosi.extra/etc/vconsole.conf
Timezone=Europe/Berlin
Locale=C.UTF-8
Bootable=yes
# no NvPCRs, systemd's measurements into the TPM's NV indexes, which the box never reads, and which
# fail to be made on a Dell laptop's TPM and swtpm's alike: none defined, the units measuring into
# them masked, of mkosi.extra/etc/systemd/system, and the initrd's TPM setup, which makes them, too,
# below, as the system's makes the TPM's storage key all the same
RemoveFiles=/usr/lib/nvpcr
Bootloader=systemd-boot
# the boot's messages, few, on the first virtual console, the box's screen on the second, which
# nothing else writes to; the text console on the display at once, as the kernel otherwise waits for
# a boot's messages, which a quiet one never prints
# and no kernel auditing, which a box never reads, and which flooded the log of every unit started
# and its own system's partition, of its version, as A and B each hold one, and an older UKI, which
# systemd-boot falls back to of an update that failed, must boot its own
KernelCommandLine=console=tty1 quiet loglevel=3 systemd.show_status=error fbcon=nodefer audit=0
    root=PARTLABEL=leat_%v rd.systemd.mask=systemd-tpm2-setup-early.service
# named of its version, as systemd-boot and systemd-sysupdate order the box's UKIs
UnifiedKernelImageFormat=leat_%v
# the initrd's drivers: mkosi's, to reach the disk, without the GPU's, Wi-Fi's, Bluetooth's and
# sound's, whose firmware is most of linux-firmware: they load from the system once it is mounted.
# But every USB disk's, as uas, which a USB 3 stick speaks, and without which a laptop never found
# its stick; and simpledrm, of the firmware's framebuffer, which no firmware needs, so that the
# display shows the boot before the GPU's own driver loads
KernelInitrdModules=
    default
    -/drivers/gpu/
    -/drivers/net/wireless/
    -/drivers/bluetooth/
    -/sound/
    /drivers/usb/storage/
    simpledrm
Packages=
    linux
    linux-firmware
    amd-ucode
    intel-ucode
    systemd
    tpm2-tss
    iproute2
    e2fsprogs
    ca-certificates
    python
    bubblewrap
    grep
    qrencode
    terminus-font
    inter-font
    iwd
    gnupg
BuildPackages=
    uv
    go
    git
    curl
    tar
    gzip

[Validation]
# the PCR values the UKI expects, signed by mkosi.key, of keys.sh, so that the TPM unlocks the box's
# encrypted partitions for a UKI of ours alone, of whichever image an update brings
SignExpectedPcr=yes

[Runtime]
RuntimeSize=24G
