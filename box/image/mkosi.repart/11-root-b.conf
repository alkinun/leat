# The system's other half, B, empty until an update writes it: made with the image, not on the box's
# first boot, so that systemd-repart there, which makes only the identity's and the state's
# partitions, never mistakes the half an update is writing for one it must make. Of no split file,
# as it holds nothing an update is made of
[Partition]
Type=root
Label=_empty
SizeMinBytes=8G
SizeMaxBytes=8G
SplitName=-
