# the office's data, leat agent's: on the data partition, once mounted
d /var/lib/leat 0750 leat leat -
# the sandbox's libraries, of the image, where leat agent looks for them
L+ /var/lib/leat/sandbox - - - - /opt/leat/sandbox
# the box's identity, of provisioning, on its own partition, once mounted; and Caddy's state, there
# too, as a factory reset, which erases the data's, would have it ask for a certificate anew, and
# Let's Encrypt gives a name five a week
d /etc/leat 0755 root root -
d /etc/leat/proxy 0700 leat-proxy leat-proxy -
# networkd's runtime folder, where the box's system helper writes a fixed address an admin set
d /run/systemd/network 0755 root root -
